<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BOUNCEBACK — Play in Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05080f;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.25);
      border: 1px solid rgba(0, 242, 254, 0.3);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #070a10;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Web Audio Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration, endFreq = null, gainVal = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (endFreq) {
          osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function sfxBounce() { playTone(160, 'sine', 0.22, 480, 0.25); }
    function sfxBumper() { playTone(240, 'triangle', 0.3, 720, 0.3); }
    function sfxCoin() { playTone(650, 'sine', 0.18, 1200, 0.2); }
    function sfxWarning() { playTone(880, 'square', 0.08, null, 0.15); }
    function sfxCrash() { playTone(120, 'sawtooth', 0.5, 30, 0.35); }

    // Constants
    const GRAVITY = 1320;
    const THRUST_ACCEL = -2250;
    const MAX_RISE_SPEED = -660;
    const MAX_FALL_SPEED = 880;
    const FLOOR_BOUNCE = -520;
    const CEILING_BOUNCE = 380;
    const BASE_SCROLL_SPEED = 340;

    // Game State
    let distance = 0;
    let coins = 0;
    let combo = 1;
    let comboTimer = 0;
    let bestDistance = 0;
    let isAlive = true;
    let isThrusting = false;
    let scrollSpeed = BASE_SCROLL_SPEED;
    let scrollOffset = 0;

    // Player Object
    const player = {
      x: 220,
      y: 360,
      radius: 24,
      vy: 0,
      scaleX: 1,
      scaleY: 1,
      targetScaleX: 1,
      targetScaleY: 1,
      tilt: 0
    };

    // Entities Arrays
    let particles = [];
    let shockwaves = [];
    let obstacles = [];
    let coinsList = [];
    let missiles = [];

    // Spawner Timers
    let obstacleTimer = 1.0;
    let coinTimer = 0.5;
    let missileTimer = 7.0;

    // Input Listeners
    function setThrust(state) {
      initAudio();
      if (!isAlive && state) {
        restartGame();
        return;
      }
      isThrusting = state;
    }

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        setThrust(true);
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        setThrust(false);
      }
    });
    canvas.addEventListener('mousedown', (e) => { setThrust(true); });
    window.addEventListener('mouseup', (e) => { setThrust(false); });
    canvas.addEventListener('touchstart', (e) => { setThrust(true); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchend', (e) => { setThrust(false); });

    function restartGame() {
      distance = 0;
      coins = 0;
      combo = 1;
      comboTimer = 0;
      isAlive = true;
      isThrusting = false;
      scrollSpeed = BASE_SCROLL_SPEED;
      player.x = 220;
      player.y = 360;
      player.vy = 0;
      player.scaleX = 1;
      player.scaleY = 1;
      particles = [];
      shockwaves = [];
      obstacles = [];
      coinsList = [];
      missiles = [];
      obstacleTimer = 1.0;
      coinTimer = 0.5;
      missileTimer = 7.0;
    }

    function addShockwave(x, y, color = '#00f2fe', maxR = 60) {
      shockwaves.push({ x, y, r: 8, maxR, color, alpha: 0.9 });
    }

    function addParticles(x, y, count, color, minV, maxV, life = 0.4) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = minV + Math.random() * (maxV - minV);
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: life,
          maxLife: life,
          color: color,
          size: 2 + Math.random() * 4
        });
      }
    }

    function triggerBounce(type, impulseY) {
      if (!isAlive) return;
      player.vy = impulseY;
      combo = Math.min(combo + 1, 5);
      comboTimer = 2.8;

      if (type === 'floor') {
        player.scaleX = 1.35; player.scaleY = 0.65;
        sfxBounce();
        addShockwave(player.x, 650, '#00ff88');
      } else if (type === 'ceiling') {
        player.scaleX = 1.25; player.scaleY = 0.75;
        sfxBounce();
        addShockwave(player.x, 70, '#00f2fe');
      } else if (type === 'bumper') {
        player.scaleX = 1.45; player.scaleY = 0.55;
        sfxBumper();
      }

      addParticles(player.x, player.y, 18, '#00f2fe', 120, 280);
    }

    function killPlayer() {
      if (!isAlive) return;
      isAlive = false;
      sfxCrash();
      bestDistance = Math.max(bestDistance, Math.floor(distance));
      addParticles(player.x, player.y, 45, '#ff4e50', 160, 420, 0.8);
      addShockwave(player.x, player.y, '#ff0844', 120);
      player.vy = -350;
    }

    // Main Game Loop
    let lastTime = performance.now();

    function update(dt) {
      if (isAlive) {
        // Distance & Scroll Speed
        distance += scrollSpeed * dt * 0.08;
        scrollSpeed = BASE_SCROLL_SPEED + (distance * 0.09);
        scrollOffset = (scrollOffset + scrollSpeed * dt) % 80;

        // Combo Decay
        if (combo > 1) {
          comboTimer -= dt;
          if (comboTimer <= 0) combo = 1;
        }

        // Thrust & Physics
        if (isThrusting) {
          player.vy = Math.max(player.vy + THRUST_ACCEL * dt, MAX_RISE_SPEED);
          player.targetScaleX = 0.85;
          player.targetScaleY = 1.18;
          // Thruster flames
          particles.push({
            x: player.x + (Math.random() - 0.5) * 8,
            y: player.y + 20,
            vx: -scrollSpeed * 0.4 + (Math.random() - 0.5) * 60,
            vy: 200 + Math.random() * 200,
            life: 0.25, maxLife: 0.25,
            color: Math.random() > 0.4 ? '#ffa751' : '#ff4e50',
            size: 3 + Math.random() * 3
          });
        } else {
          player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL_SPEED);
          player.targetScaleX = 1;
          player.targetScaleY = 1;
        }

        player.y += player.vy * dt;

        // Floor / Ceiling Rebound Collision
        if (player.y >= 650 - player.radius) {
          player.y = 650 - player.radius;
          triggerBounce('floor', FLOOR_BOUNCE);
        } else if (player.y <= 70 + player.radius) {
          player.y = 70 + player.radius;
          triggerBounce('ceiling', CEILING_BOUNCE);
        }

        // Scale & Rotation Lerp
        player.scaleX += (player.targetScaleX - player.scaleX) * dt * 14;
        player.scaleY += (player.targetScaleY - player.scaleY) * dt * 14;
        player.tilt += (Math.max(-0.3, Math.min(0.35, player.vy * 0.0005)) - player.tilt) * dt * 8;

        // Spawners
        obstacleTimer -= dt;
        if (obstacleTimer <= 0) {
          spawnObstacle();
          obstacleTimer = 1.5 + Math.random() * 1.0;
        }

        coinTimer -= dt;
        if (coinTimer <= 0) {
          spawnCoinArc();
          coinTimer = 2.0 + Math.random() * 1.5;
        }

        missileTimer -= dt;
        if (missileTimer <= 0) {
          spawnMissile();
          missileTimer = 7.0 + Math.random() * 5.0;
        }
      } else {
        // Dead tumble
        player.vy += GRAVITY * dt;
        player.y += player.vy * dt;
        player.tilt += 8 * dt;
      }

      // Update Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += dt * 260;
        sw.alpha -= dt * 2.2;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update Obstacles (Bumpers & Lasers)
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.x -= scrollSpeed * dt;

        if (isAlive) {
          if (ob.type === 'bumper') {
            const dx = player.x - ob.x;
            const dy = player.y - ob.y;
            const dist = Math.hypot(dx, dy);
            if (dist < player.radius + ob.radius) {
              let nx = dx / dist;
              let ny = dy / dist;
              if (ny > -0.35) ny = -0.75;
              player.vy = ny * 680;
              triggerBounce('bumper', player.vy);
              coins += 15 * combo;
              addShockwave(ob.x, ob.y, '#00f2fe', 80);
              ob.punch = 1.4;
            }
          } else if (ob.type === 'laser') {
            // Segment to circle collision
            const half = ob.len * 0.5;
            const cos = Math.cos(ob.angle);
            const sin = Math.sin(ob.angle);
            const p1x = ob.x - half * cos;
            const p1y = ob.y - half * sin;
            const p2x = ob.x + half * cos;
            const p2y = ob.y + half * sin;

            const l2 = ob.len * ob.len;
            let t = ((player.x - p1x) * (p2x - p1x) + (player.y - p1y) * (p2y - p1y)) / l2;
            t = Math.max(0, Math.min(1, t));
            const projX = p1x + t * (p2x - p1x);
            const projY = p1y + t * (p2y - p1y);

            if (Math.hypot(player.x - projX, player.y - projY) < player.radius + 6) {
              killPlayer();
            }
          }
        }

        if (ob.x < -150) obstacles.splice(i, 1);
      }

      // Update Coins
      for (let i = coinsList.length - 1; i >= 0; i--) {
        const c = coinsList[i];
        c.x -= scrollSpeed * dt;
        c.pulse += dt * 6;

        if (isAlive) {
          if (Math.hypot(player.x - c.x, player.y - c.y) < player.radius + 16) {
            coins += 10 * combo;
            sfxCoin();
            addParticles(c.x, c.y, 8, '#ffe259', 80, 200, 0.3);
            coinsList.splice(i, 1);
            continue;
          }
        }

        if (c.x < -60) coinsList.splice(i, 1);
      }

      // Update Missiles
      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        m.timer += dt;

        if (m.state === 'warning') {
          m.x = 1220;
          if (isAlive) {
            m.y += (player.y - m.y) * dt * 6.5;
          }
          m.y = Math.max(110, Math.min(610, m.y));

          if (m.timer >= 1.3) {
            m.state = 'launched';
          }
        } else {
          m.x -= 920 * dt;

          if (isAlive && Math.hypot(player.x - m.x, player.y - m.y) < player.radius + 14) {
            killPlayer();
          }

          if (m.x < -120) missiles.splice(i, 1);
        }
      }
    }

    function spawnObstacle() {
      if (Math.random() < 0.45) {
        obstacles.push({
          type: 'bumper',
          x: 1340,
          y: 160 + Math.random() * 400,
          radius: 30,
          punch: 1.0
        });
      } else {
        const angles = [0, Math.PI / 4, -Math.PI / 4, Math.PI / 2];
        obstacles.push({
          type: 'laser',
          x: 1340,
          y: 160 + Math.random() * 400,
          len: 110 + Math.random() * 50,
          angle: angles[Math.floor(Math.random() * angles.length)],
          flicker: 0
        });
      }
    }

    function spawnCoinArc() {
      const useArc = Math.random() > 0.5;
      const baseY = 180 + Math.random() * 340;
      for (let i = 0; i < 5; i++) {
        coinsList.push({
          x: 1340 + i * 44,
          y: baseY + (useArc ? Math.sin(i * 0.75) * 50 : 0),
          pulse: i
        });
      }
    }

    function spawnMissile() {
      sfxWarning();
      missiles.push({
        x: 1220,
        y: player.y,
        timer: 0,
        state: 'warning'
      });
    }

    // Rendering
    function draw() {
      ctx.clearRect(0, 0, 1280, 720);

      // 1. Background Grid & Lab
      ctx.fillStyle = '#070a10';
      ctx.fillRect(0, 0, 1280, 720);

      ctx.strokeStyle = 'rgba(0, 242, 254, 0.07)';
      ctx.lineWidth = 1;
      for (let x = -scrollOffset; x < 1280; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 70); ctx.lineTo(x, 650);
        ctx.stroke();
      }
      for (let y = 120; y < 650; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(1280, y);
        ctx.stroke();
      }

      // Ceiling Rail (y: 0 - 70)
      ctx.fillStyle = '#090d14';
      ctx.fillRect(0, 0, 1280, 70);
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 70); ctx.lineTo(1280, 70); ctx.stroke();

      // Floor Rail (y: 650 - 720)
      ctx.fillStyle = '#090d14';
      ctx.fillRect(0, 650, 1280, 70);
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(0, 650); ctx.lineTo(1280, 650); ctx.stroke();

      // 2. Shockwaves
      shockwaves.forEach(sw => {
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      });

      // 3. Coins
      coinsList.forEach(c => {
        const wobble = 1.0 + 0.12 * Math.sin(c.pulse);
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(wobble, wobble);
        ctx.fillStyle = '#ffe259';
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#ffa751';
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });

      // 4. Obstacles
      obstacles.forEach(ob => {
        if (ob.type === 'bumper') {
          if (ob.punch > 1.0) ob.punch = Math.max(1.0, ob.punch - 0.05);
          ctx.save();
          ctx.translate(ob.x, ob.y);
          ctx.scale(ob.punch, ob.punch);
          // Hexagon
          ctx.fillStyle = '#0d1b2a';
          ctx.strokeStyle = '#00f2fe';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3;
            const hx = Math.cos(a) * ob.radius;
            const hy = Math.sin(a) * ob.radius;
            if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Inner chevron
          ctx.fillStyle = '#00c6ff';
          ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(3, 0); ctx.lineTo(-5, 6); ctx.stroke();
          ctx.restore();
        } else if (ob.type === 'laser') {
          const half = ob.len * 0.5;
          ctx.save();
          ctx.translate(ob.x, ob.y);
          ctx.rotate(ob.angle);
          // Electric Beam
          const pulse = 0.7 + 0.3 * Math.sin(performance.now() * 0.02);
          ctx.strokeStyle = 'rgba(255, 8, 68, 0.4)';
          ctx.lineWidth = 14 * pulse;
          ctx.beginPath(); ctx.moveTo(-half, 0); ctx.lineTo(half, 0); ctx.stroke();
          ctx.strokeStyle = '#ff4e50';
          ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(-half, 0); ctx.lineTo(half, 0); ctx.stroke();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-half, 0); ctx.lineTo(half, 0); ctx.stroke();
          // Emitter nodes
          [-half, half].forEach(ex => {
            ctx.fillStyle = '#1b2432';
            ctx.strokeStyle = '#ff0844';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(ex, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#ff4e50';
            ctx.beginPath(); ctx.arc(ex, 0, 5, 0, Math.PI * 2); ctx.fill();
          });
          ctx.restore();
        }
      });

      // 5. Missiles
      missiles.forEach(m => {
        if (m.state === 'warning') {
          ctx.save();
          ctx.translate(m.x, m.y);
          const alpha = 0.4 + 0.6 * Math.sin(m.timer * 18);
          ctx.fillStyle = `rgba(27, 10, 13, ${alpha})`;
          ctx.strokeStyle = `rgba(255, 8, 68, ${alpha})`;
          ctx.lineWidth = 2;
          ctx.strokeRect(-16, -16, 32, 32);
          ctx.fillStyle = `rgba(255, 8, 68, ${alpha})`;
          ctx.fillRect(-2, -10, 4, 12);
          ctx.beginPath(); ctx.arc(0, 8, 2.5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.translate(m.x, m.y);
          ctx.fillStyle = '#ff4e50';
          ctx.beginPath(); ctx.moveTo(18, -4); ctx.lineTo(36, 0); ctx.lineTo(18, 4); ctx.fill();
          ctx.fillStyle = '#e6194b';
          ctx.fillRect(-16, -7, 34, 14);
          ctx.fillStyle = '#ffe259';
          ctx.beginPath(); ctx.arc(-16, 0, 7, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
          ctx.restore();
        }
      });

      // 6. Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // 7. Player (Bouncy-Bot)
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.tilt);
      ctx.scale(player.scaleX, player.scaleY);

      // Cyber-Orb Body
      ctx.fillStyle = '#141c2c';
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // Top Fin
      ctx.fillStyle = '#00f2fe';
      ctx.beginPath(); ctx.arc(0, -player.radius - 4, 3, 0, Math.PI * 2); ctx.fill();

      // Visor
      ctx.fillStyle = '#070e17';
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 1.5;
      ctx.fillRect(-2, -9, 20, 14);
      ctx.strokeRect(-2, -9, 20, 14);
      ctx.fillStyle = '#00f2fe';
      ctx.beginPath(); ctx.arc(9, -2, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(10, -3, 1.5, 0, Math.PI * 2); ctx.fill();

      ctx.restore();

      // 8. HUD Overlay
      ctx.fillStyle = '#00f2fe';
      ctx.font = 'bold 30px "Space Grotesk", sans-serif';
      ctx.fillText(`${Math.floor(distance)} m`, 40, 48);

      ctx.fillStyle = '#ffe259';
      ctx.font = 'bold 28px "Space Grotesk", sans-serif';
      ctx.fillText(`🪙 ${coins}`, 600, 48);

      if (combo > 1) {
        ctx.fillStyle = '#00ff88';
        ctx.font = 'bold 30px "Space Grotesk", sans-serif';
        ctx.fillText(`BOUNCE x${combo}!`, 1040, 48);
      }

      // Game Over Screen
      if (!isAlive) {
        ctx.fillStyle = 'rgba(7, 10, 16, 0.85)';
        ctx.fillRect(0, 0, 1280, 720);

        ctx.fillStyle = '#ff0844';
        ctx.font = '900 64px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('BOUNCE OVER', 640, 280);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '600 24px sans-serif';
        ctx.fillText(`Distance: ${Math.floor(distance)} m  (Best: ${bestDistance} m)`, 640, 340);
        ctx.fillStyle = '#ffe259';
        ctx.fillText(`Coins Collected: ${coins}`, 640, 380);

        ctx.fillStyle = '#00f2fe';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('TAP OR PRESS SPACE TO BOUNCEBACK', 640, 450);
        ctx.textAlign = 'left';
      }
    }

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
